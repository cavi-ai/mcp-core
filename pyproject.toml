[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cavi-mcp-core"
version = "0.1.1"
description = "Server type, result contracts, schemas, bounded processes and file journals for CAVI MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CAVI AI" }]
keywords = ["mcp", "model-context-protocol", "mcp-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/cavi-ai/mcp-core#readme"
Repository = "https://github.com/cavi-ai/mcp-core"
Issues = "https://github.com/cavi-ai/mcp-core/issues"
Changelog = "https://github.com/cavi-ai/mcp-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cavi_mcp_core"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
