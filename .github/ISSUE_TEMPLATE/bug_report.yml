name: Bug report
description: A defect in the library or the documentation
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove private paths and tool values before sharing. For a security
        vulnerability, use a private security advisory instead of an issue.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Server, results and errors
        - Schemas
        - Workspace and files
        - Applications
        - Processes, supervision and inspection
        - Documentation
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code or MCP request that shows it
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message or the structured error result
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, uv version and MCP SDK version
    validations:
      required: true
