name: pin-consumers

# Moves the server pins of each consumer to main, checks the pinned consumer and merges the pin.
on:
  workflow_call:
    inputs:
      consumers:
        description: JSON list of consumer repositories under cavi-ai.
        required: true
        type: string
      core_sha:
        description: The core commit checked by the caller's CI jobs.
        required: true
        type: string
    secrets:
      token:
        description: "Fine-grained token: contents read on the server repos; contents and pull requests write on the consumers."
        required: true

permissions: {}

jobs:
  pin:
    name: pin ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJSON(inputs.consumers) }}
    concurrency:
      group: pin-${{ matrix.consumer }}
      cancel-in-progress: false
    env:
      CONSUMER: ${{ matrix.consumer }}
    steps:
      - name: Require the token
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: test -n "$GH_TOKEN" || { echo "::error::Pass the consumer token as the token secret"; exit 1; }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: matrix.consumer == 'game-art-pipeline'
        with:
          python-version: "3.15"
      - name: Check out the game art consumer and its private submodules
        if: matrix.consumer == 'game-art-pipeline'
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/cavi-ai/".insteadOf "https://github.com/cavi-ai/"
          git clone -q --recurse-submodules "https://github.com/cavi-ai/$CONSUMER" consumer > /dev/null 2>&1
      - id: sync_submodules
        name: Move the game art pins
        if: matrix.consumer == 'game-art-pipeline'
        working-directory: consumer
        run: |
          set -euo pipefail
          python3 scripts/servers.py sync > "$RUNNER_TEMP/sync.json" 2> /dev/null
          python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["changed"] else 1)' "$RUNNER_TEMP/sync.json" || exit 0
          key=$(git submodule status | awk '{gsub(/^[-+U]/, "", $1); print substr($1, 1, 7)}' | paste -sd- -)
          python3 -c 'import json, sys; m = json.load(open(sys.argv[1]))["moved"]; print("\n".join("- %s %s -> %s" % (r, (v["from"] or "new")[:7], v["to"][:7]) for r, v in m.items()))' "$RUNNER_TEMP/sync.json" > "$RUNNER_TEMP/pin-body.md"
          echo "branch=bot/pin-servers-$key" >> "$GITHUB_OUTPUT"
      - name: Check the pinned game art consumer
        if: steps.sync_submodules.outputs.branch
        working-directory: consumer
        run: |
          set -euo pipefail
          check() {
            "$@" > "$RUNNER_TEMP/check.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/check.log"; exit 1; }
          }
          check uv sync --locked --dev
          check uv run --locked ruff check scripts tests skills
          check uv run --locked python -m pytest tests -n auto
          for suite in skills/blender-unity-assets/scripts skills/unity-hdrp/scripts; do
            check uv run --locked python -m unittest discover -s "$suite"
          done
      - name: Check out the lockfile consumer
        if: matrix.consumer != 'game-art-pipeline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cavi-ai/${{ matrix.consumer }}
          token: ${{ secrets.token }}
          persist-credentials: false
          path: consumer
      - id: sync_lock
        name: Resolve and check the consumer lockfile
        if: matrix.consumer != 'game-art-pipeline' && matrix.consumer != 'ableton-mcp'
        working-directory: consumer
        env:
          CORE_SHA: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          lint=(scripts tests)
          case "$CONSUMER" in
            cavi-creative-marketing) packages=(cavi-mcp-core mlx-agent) ;;
            cartoon-pipeline) packages=(cavi-mcp-core mlx-agent cavi-adobe-mcp cavi-character-animator-mcp) ;;
            pipeline) packages=(cavi-mcp-core); lint=(.) ;;
            *) echo "::error::No pin steps for this consumer"; exit 1 ;;
          esac
          if [ ! -f uv.lock ]; then
            echo "::notice::The consumer has no uv.lock on main. Skipping the pin."
            exit 0
          fi
          # Only the copied checkout is mounted. Consumer code cannot write to the publishing checkout or runner commands.
          scratch=$(mktemp -d "$RUNNER_TEMP/pin-checkout.XXXXXXXX")
          cp -a . "$scratch"
          image=ghcr.io/astral-sh/uv:0.13.6-python3.15-trixie@sha256:f68dfb3eaf23a53afb5f74833bdacc0ce586d69f8063c48f9f3ebbe42e048e4a
          isolated() {
            docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
              --mount "type=bind,source=$scratch,target=/consumer" --workdir /consumer --env HOME=/tmp \
              "$image" "$@" >> "$RUNNER_TEMP/check.log" 2>&1
          }
          if ! isolated uv lock "${packages[@]/#/--upgrade-package=}"; then
            echo "::error::Consumer lock resolution failed"; exit 1
          fi
          candidate="$scratch/uv.lock"
          if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
            echo "::error::Consumer lock resolution did not produce a regular lockfile"; exit 1
          fi
          verified="$RUNNER_TEMP/verified-uv.lock"
          cp "$candidate" "$verified"
          locked() {
            python3 -I -c 'import sys, tomllib; names = set(sys.argv[2:]); [print(p["name"], p["source"]["git"].rsplit("#", 1)[1]) for p in tomllib.load(open(sys.argv[1], "rb"))["package"] if p["name"] in names and "git" in p["source"]]' "$1" "${packages[@]}"
          }
          locked "$verified" > "$RUNNER_TEMP/after.txt"
          resolved=$(awk '$1 == "cavi-mcp-core" { print $2 }' "$RUNNER_TEMP/after.txt")
          if [ "$resolved" != "$CORE_SHA" ]; then
            echo "::notice::Resolved core differs from this CI revision. Skipping the pin."
            exit 0
          fi
          cmp -s uv.lock "$verified" && exit 0
          image=$(docker build --quiet --build-arg "BASE_IMAGE=$image" - <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          )
          if ! isolated bash -euc 'uv sync --locked --dev && uv run --locked ruff check "$@" && uv run --locked python -m unittest discover -s tests' checks "${lint[@]}"; then
            echo "::error::Pinned consumer checks failed"; exit 1
          fi
          if [ ! -f "$candidate" ] || [ -L "$candidate" ] || ! cmp -s "$candidate" "$verified"; then
            echo "::error::The consumer checks changed the resolved lockfile"; exit 1
          fi
          locked uv.lock > "$RUNNER_TEMP/before.txt"
          python3 -I -c 'import sys; a = dict(l.split() for l in open(sys.argv[1])); b = dict(l.split() for l in open(sys.argv[2])); print("\n".join("- %s %s -> %s" % (n, (a.get(n) or "new")[:7], v[:7]) for n, v in b.items() if a.get(n) != v))' "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" > "$RUNNER_TEMP/pin-body.md"
          cp "$verified" uv.lock
          key=$({ git rev-parse HEAD; sha256sum uv.lock; } | sha256sum | cut -c1-12)
          echo "branch=bot/pin-servers-$key" >> "$GITHUB_OUTPUT"
      - id: sync_npm
        name: Resolve and check the npm consumer lockfile
        if: matrix.consumer == 'ableton-mcp'
        working-directory: consumer
        env:
          CORE_SHA: ${{ inputs.core_sha }}
        run: |
          set -euo pipefail
          if ! jq -e '.dependencies["@cavi-ai/mcp-core"]' package.json > /dev/null; then
            echo "::notice::The consumer does not depend on @cavi-ai/mcp-core on main. Skipping the pin."
            exit 0
          fi
          # Only the copied checkout is mounted. Consumer code cannot write to the publishing checkout or runner commands.
          scratch=$(mktemp -d "$RUNNER_TEMP/pin-checkout.XXXXXXXX")
          cp -a . "$scratch"
          # The full image carries git, which npm needs to resolve a git dependency.
          image=node:26.13.0-trixie@sha256:438603bbb5cda404b9416f0b5c8026f61501ab911760d861ec28c36b5d675725
          isolated() {
            docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
              --mount "type=bind,source=$scratch,target=/consumer" --workdir /consumer --env HOME=/tmp \
              "$image" "$@" >> "$RUNNER_TEMP/check.log" 2>&1
          }
          if ! isolated npm install --ignore-scripts --no-audit --no-fund "github:cavi-ai/mcp-core#main"; then
            echo "::error::Consumer lock resolution failed"; exit 1
          fi
          candidate="$scratch/package-lock.json"
          if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
            echo "::error::Consumer lock resolution did not produce a regular lockfile"; exit 1
          fi
          if ! cmp -s package.json "$scratch/package.json"; then
            echo "::error::Consumer lock resolution changed package.json"; exit 1
          fi
          verified="$RUNNER_TEMP/verified-package-lock.json"
          cp "$candidate" "$verified"
          locked() {
            jq -r '.packages["node_modules/@cavi-ai/mcp-core"].resolved // "" | split("#") | last' "$1"
          }
          resolved=$(locked "$verified")
          if [ "$resolved" != "$CORE_SHA" ]; then
            echo "::notice::Resolved core differs from this CI revision. Skipping the pin."
            exit 0
          fi
          cmp -s package-lock.json "$verified" && exit 0
          image=$(docker build --quiet --build-arg "BASE_IMAGE=$image" - <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          )
          if ! isolated bash -euc 'npm ci --ignore-scripts --no-audit --no-fund && npm run test:mcp'; then
            echo "::error::Pinned consumer checks failed"; exit 1
          fi
          if [ ! -f "$candidate" ] || [ -L "$candidate" ] || ! cmp -s "$candidate" "$verified"; then
            echo "::error::The consumer checks changed the resolved lockfile"; exit 1
          fi
          before=$(locked package-lock.json)
          echo "- @cavi-ai/mcp-core ${before:0:7} -> ${resolved:0:7}" > "$RUNNER_TEMP/pin-body.md"
          cp "$verified" package-lock.json
          key=$({ git rev-parse HEAD; sha256sum package-lock.json; } | sha256sum | cut -c1-12)
          echo "branch=bot/pin-servers-$key" >> "$GITHUB_OUTPUT"
      - name: Propose and merge the pin
        if: steps.sync_submodules.outputs.branch || steps.sync_lock.outputs.branch || steps.sync_npm.outputs.branch
        working-directory: consumer
        env:
          BRANCH: ${{ steps.sync_submodules.outputs.branch || steps.sync_lock.outputs.branch || steps.sync_npm.outputs.branch }}
          GH_TOKEN: ${{ secrets.token }}
        run: |
          set -euo pipefail
          case "$CONSUMER" in
            game-art-pipeline) paths=(.gitmodules pyproject.toml uv.lock servers plugin.json .claude-plugin .codex-plugin) ;;
            cartoon-pipeline|cavi-creative-marketing|pipeline) paths=(uv.lock) ;;
            ableton-mcp) paths=(package-lock.json) ;;
          esac
          gh auth setup-git --hostname github.com
          git add -A -- "${paths[@]}"
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$head" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -q -c "$BRANCH"
            git commit -q -m "chore: pin servers to main"
            head=$(git rev-parse HEAD)
            git push -q origin "$BRANCH" > /dev/null 2>&1
          elif [ "$CONSUMER" != game-art-pipeline ]; then
            git fetch -q --no-tags origin "refs/heads/$BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$head"
            test "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD)"
            git diff --cached --quiet FETCH_HEAD
          fi
          if [ -z "$(gh pr list --head "$BRANCH" --state all --json number -q '.[0].number')" ]; then
            for old in $(gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("bot/pin-servers-")) | .number'); do
              gh pr close "$old" --delete-branch --comment "Superseded by a newer server pin." > /dev/null 2>&1
            done
            gh pr create --head "$BRANCH" --title "chore: pin servers to main" --body-file "$RUNNER_TEMP/pin-body.md" > /dev/null
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr merge "$BRANCH" --squash --match-head-commit "$head" > /dev/null
          fi
